name: CI

# 셸 자산과 네이티브 프로젝트가 깨지지 않았는지만 본다.
# 스토어 업로드는 release 워크플로가 따로 한다.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: 셸 빌드 · 타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # www/ 는 커밋하지 않으므로, 빌드 산출물이 실제로 나왔는지 확인한다.
      - name: 브릿지 스크립트가 산출물에 포함됐는지
        run: test -f www/nuplex-bridge.js

  android:
    name: Android 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      # Firebase 설정 파일은 저장소에 없다. 없어도 빌드는 통과해야 한다
      # (android/app/build.gradle 이 파일이 없으면 플러그인을 건너뛴다).
      - name: Capacitor sync
        run: npm run cap -- sync android
        env:
          CAP_SKIP_JBR: '1'
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: iOS 빌드
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run cap -- sync ios

      # GoogleService-Info.plist 는 시크릿이라 커밋하지 않는데(.gitignore) Xcode 프로젝트가
      # 참조한다. 파일이 없으면 컴파일 전에 통째로 실패한다 —
      # "Build input file cannot be found" (exit 65). 실제로 이걸로 CI 가 빨갛게 됐다.
      #
      # 이 잡이 보는 것은 컴파일 오류뿐이라 진짜 값이 필요 없다. 시크릿이 있으면 그것을,
      # 없으면 자리표시자를 쓴다. **릴리스 빌드는 ios-release.yml 이 진짜 값을 넣는다.**
      - name: Firebase 설정 파일 준비
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          else
            echo "::notice::GOOGLE_SERVICE_INFO_PLIST 가 없어 자리표시자로 빌드합니다"
            cat > ios/App/App/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>ci-placeholder</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>BUNDLE_ID</key><string>com.nugabox.nuplex</string>
            <key>PROJECT_ID</key><string>ci-placeholder</string>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
            <key>IS_GCM_ENABLED</key><true/>
          </dict>
          </plist>
          PLIST
          fi

      # 서명 없이 시뮬레이터용으로만 빌드한다. 인증서가 CI 에 없어도 컴파일 오류는 잡힌다.
      - name: 시뮬레이터 빌드
        working-directory: ios/App
        run: |
          xcodebuild -scheme App -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
