name: Play 스토어 등록정보

# 아이콘 · 그래픽 이미지 · 휴대전화 스크린샷을 Play Console 에 올린다.
#
# ## 왜 워크플로인가
#
# 콘솔의 애셋 업로드는 OS 파일 선택창을 띄운다. 브라우저 자동화로 닿을 수 없고,
# 콘솔은 Trusted Types 로 페이지 안 JS 실행도 막아 둬서 숨은 파일 입력에 직접 넣는
# 우회로도 없다 (2026-09-01 실제로 막힘). API 는 그 전부를 건너뛴다.
#
# 덤으로 애셋이 저장소에 남아 다시 만들 수 있게 된다 —
# 원본과 만드는 법은 `resources/store/play/README.md`.
#
# ## 필요한 Secrets
#
#   PLAY_SERVICE_ACCOUNT_JSON   `android-release.yml` 이 쓰는 것과 **같은 키**다
#
# **서비스 계정에 "스토어 등록정보" 편집 권한이 있어야 한다.** 앱 번들 업로드 권한만
# 있으면 이미지 업로드가 403 으로 끝난다. Play Console → 사용자 및 권한에서 준다.
#
# ## 쓰는 법
#
# 반드시 `inspect` 를 먼저 돌린다. 콘솔에 저장해 둔 텍스트를 그대로 찍어 주므로,
# 무엇을 덮어쓰게 되는지 보고 나서 `apply` 로 넘어간다. `apply` 는 텍스트를 손대지
# 않고 이미지만 바꾼다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = 읽기만 (아무것도 안 바뀜) · apply = 이미지 반영'
        required: true
        default: inspect
        type: choice
        options: [inspect, apply]

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 Secret 확인
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON 이 설정되지 않았습니다."
            exit 1
          fi
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      # requests 는 google-auth 의 전송 계층이 요구한다. 빼면 ImportError 로 끝난다.
      - run: pip install --quiet google-auth requests

      - name: 등록정보 ${{ inputs.mode }}
        run: python3 scripts/play-listing.py "$MODE"
        env:
          MODE: ${{ inputs.mode }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
