name: iOS 릴리스

# 태그를 밀면 IPA 를 만들어 TestFlight 에 올린다.
#
# **필요한 Secrets** (없으면 잡이 일찍 실패한다):
#   IOS_CERTIFICATE_P12          배포 인증서(.p12)를 base64 로 인코딩한 값
#   IOS_CERTIFICATE_PASSWORD
#   IOS_PROVISIONING_PROFILE     프로비저닝 프로파일을 base64 로 인코딩한 값
#   GOOGLE_SERVICE_INFO_PLIST    Firebase 설정 파일 내용
#   APPSTORE_ISSUER_ID           App Store Connect API 키
#   APPSTORE_KEY_ID
#   APPSTORE_PRIVATE_KEY         .p8 내용
#
# .p8 은 재다운로드가 불가능하다. 안전한 곳에 원본을 보관할 것(docs/FIREBASE_SETUP.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 필요한 Secrets 확인
        run: |
          for name in IOS_CERTIFICATE_P12 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE GOOGLE_SERVICE_INFO_PLIST APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then echo "::error::$name 이 설정되지 않았습니다"; exit 1; fi
          done
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: 서명 자산 설치
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist

          # 임시 키체인에만 넣는다. 러너는 매번 새로 만들어지지만 습관을 지킨다.
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/nuplex.mobileprovision
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}

      - run: npm ci
      - run: npm run build
      - run: npm run cap -- sync ios

      # 빌드번호는 CI 가 채번한다. 손으로 관리하지 않는다(docs/RELEASE.md).
      - name: CFBundleVersion 채번
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/App/App/Info.plist

      - name: 아카이브
        working-directory: ios/App
        run: |
          xcodebuild -scheme App -sdk iphoneos -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive

      # TODO: exportOptions.plist 를 저장소에 추가한 뒤 아래를 활성화한다.
      #       teamID(U5796QB9C8), method(app-store-connect), 프로파일 이름이 들어간다.
      # - name: IPA 내보내기
      #   working-directory: ios/App
      #   run: |
      #     xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
      #       -exportOptionsPlist exportOptions.plist -exportPath "$RUNNER_TEMP/export"
      #
      # - name: TestFlight 업로드
      #   run: |
      #     xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
      #       --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
      #       --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: 시크릿 정리
        if: always()
        run: |
          rm -f ios/App/App/GoogleService-Info.plist /tmp/cert.p12
          security delete-keychain build.keychain || true
