name: iOS 릴리스

# 태그를 밀면, 또는 **한 달에 한 번 스스로**, IPA 를 만들어 TestFlight 에 올린다.
#
# ## 왜 매달 도는가
#
# TestFlight 빌드는 **업로드 시점부터 90일**이면 만료되고 연장할 방법이 없다.
# 만료되면 테스터가 앱을 못 연다. 그래서 새 빌드를 주기적으로 올려 갱신한다.
# 한 달 주기면 90일까지 세 배 여유가 있어, 한두 번 걸러도 만료되지 않는다.
# Internal 그룹은 자동 배포가 켜져 있어 올리기만 하면 테스터에게 바로 간다.
#
# ## 필요한 Secrets
#
#   APPSTORE_ISSUER_ID           App Store Connect API 키 (Issuer ID)
#   APPSTORE_KEY_ID              같은 키의 Key ID
#   APPSTORE_PRIVATE_KEY         같은 키의 .p8 파일 내용 그대로
#   GOOGLE_SERVICE_INFO_PLIST    Firebase 설정 파일 내용
#
# **API 키의 액세스 권한은 반드시 `Admin` 이어야 한다.**
# `App Manager` 로는 안 된다 — 내보내기 단계에서 이렇게 끝난다:
#
#     error: exportArchive Cloud signing permission error
#     error: exportArchive No signing certificate "iOS Distribution" found
#
# 클라우드 관리 배포 인증서에 접근하는 권한이 Admin 에만 열려 있기 때문이다
# (2026-08-21 실제로 겪음). 아카이브까지는 통과하고 내보내기에서 걸리므로
# 로그를 끝까지 봐야 보인다.
#
# **인증서(.p12)와 프로비저닝 프로파일은 넣지 않는다.** API 키를 xcodebuild 에
# 넘기면(-authenticationKey*) 자동 서명이 CI 에서도 동작해 필요한 인증서와
# 프로파일을 알아서 만들고 받아온다. 사람이 키 파일을 내보내 base64 로 옮기는
# 단계가 사라지는 대신, 키 권한이 Admin 이어야 한다는 조건이 붙는다.
# 그 조건이 싫으면 .p12 + 프로파일을 시크릿으로 넣는 방식으로 되돌리면 된다.
#
# .p8 은 재다운로드가 불가능하다. 안전한 곳에 원본을 보관할 것.

on:
  push:
    tags: ['v*']
  schedule:
    # 매달 1일 03:00 UTC (한국 정오). 만료 갱신용.
    - cron: '0 3 1 * *'
  workflow_dispatch:

# 빌드번호는 CI 가 채번한다. 손으로 관리하지 않는다(docs/RELEASE.md).
# 로컬에서 손으로 올린 빌드가 3 까지 있어 겹치지 않게 100 부터 시작한다.
# App Store Connect 는 같은 버전 안에서 빌드번호가 **반드시 커져야** 받는다.
env:
  BUILD_NUMBER_BASE: 100

jobs:
  release:
    # **macos-15 로 내리지 말 것.** 그 이미지의 기본 Xcode 는 16.x(iOS 18.5 SDK)라
    # 업로드가 이렇게 거부된다:
    #
    #     Validation failed (409) SDK version issue. This app was built with the
    #     iOS 18.5 SDK. All iOS and iPadOS apps must be built with the iOS 26 SDK
    #     or later …
    #
    # 서명·빌드는 다 통과하고 **맨 마지막 업로드에서만** 걸린다 (2026-08-21 실제로 겪음).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # SDK 문제는 로그를 끝까지 봐야 보인다. 어떤 Xcode 로 빌드했는지 먼저 남긴다.
      - name: Xcode 버전 확인
        run: xcodebuild -version && xcodebuild -showsdks | grep -i "iphoneos" || true

      - name: 필요한 Secrets 확인
        run: |
          for name in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_PRIVATE_KEY GOOGLE_SERVICE_INFO_PLIST; do
            if [ -z "${!name}" ]; then
              echo "::error::$name 이 설정되지 않았습니다. TestFlight 갱신이 돌지 않습니다."
              exit 1
            fi
          done
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Firebase 설정 · API 키 배치
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist

          # altool 과 xcodebuild 가 찾는 자리. 파일 이름 규칙이 정해져 있다.
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}

      - run: npm ci
      - run: npm run build
      - run: npm run cap -- sync ios

      - name: CFBundleVersion 채번
        run: |
          BUILD=$(( BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER ))
          echo "빌드번호: $BUILD"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" ios/App/App/Info.plist

      # **아카이브에서 서명을 끄는 이유.** Capacitor 템플릿이 Release 구성에까지
      # `iPhone Developer` 를 박아 둬서(`App.xcodeproj/project.pbxproj`) 아카이브가 *개발*
      # 인증서를 요구한다. 러너는 매번 새 머신이라 키체인이 비어 있고,
      # `-allowProvisioningUpdates` 가 그때마다 개발 인증서를 새로 발급한다. 네 번 만에
      # 계정 한도에 걸려 이렇게 끝났다 (2026-09-01 실제로 겪음):
      #
      #     error: Choose a certificate to revoke. Your account has reached the
      #            maximum number of certificates.
      #     error: No profiles for 'com.nugabox.nuplex' were found
      #
      # **`CODE_SIGN_IDENTITY="Apple Distribution"` 으로 덮는 방법은 안 된다.** 같은 날
      # 시도했고 두 군데서 걸렸다 — 명령줄 설정이 Firebase·GoogleUtilities 등 SPM 타깃
      # 전부에 퍼져 `requires a development team` 이 되고, App 타깃은
      # `automatically signed for development, but a conflicting code signing identity
      # Apple Distribution has been manually specified` 로 끝난다. 자동 서명은 아카이브
      # 단계에서 개발 서명을 고집한다.
      #
      # 그래서 아카이브는 서명 없이 만들고 배포 서명은 내보내기에만 맡긴다. 인증서를
      # 한 장도 만들지 않으므로 한도와 무관해진다. pbxproj 는 Desktop 소유 영역이라
      # (CLAUDE.md §2.2-6) 여기서 빌드 설정으로만 덮는다.
      - name: 아카이브
        working-directory: ios/App
        run: |
          xcodebuild -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # 서명은 전부 여기서 붙는다 — 배포 인증서와 App Store 프로파일 모두.
      # -allowProvisioningUpdates 가 있어야 한다(ios/App/exportOptions.plist 주석).
      # 배포 인증서는 클라우드 관리라 Apple 이 대신 들고 있어 개발 인증서 한도와 무관하다.
      - name: IPA 내보내기
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ios/App/exportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}

      # **서명 없는 아카이브에서 내보내면 권한(entitlements)이 조용히 빠질 수 있다.**
      # 아카이브에 박힌 권한이 없으니 내보내기가 프로파일을 보고 다시 붙이는데, 그게
      # 어긋나면 푸시가 안 되는 빌드가 TestFlight 까지 올라간다 — 앱을 깔아 보기 전에는
      # 모른다. 그래서 추측하지 않고 IPA 를 열어 확인하고, 없으면 여기서 멈춘다.
      - name: 서명·권한 확인
        run: |
          cd "$RUNNER_TEMP"
          rm -rf ipa_check && mkdir ipa_check
          unzip -q export/App.ipa -d ipa_check
          APP=$(ls -d ipa_check/Payload/*.app)

          echo "── 서명 ──"
          codesign -dvvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true

          echo "── 권한 ──"
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null)
          echo "$ENT"

          if ! echo "$ENT" | grep -q "aps-environment"; then
            echo "::error::IPA 에 aps-environment 가 없습니다. 이 빌드는 푸시를 받지 못합니다."
            exit 1
          fi
          if ! echo "$ENT" | grep -q "production"; then
            echo "::error::aps-environment 가 production 이 아닙니다. TestFlight 푸시가 동작하지 않습니다."
            exit 1
          fi
          echo "푸시 권한 확인됨 (aps-environment: production)"

      - name: TestFlight 업로드
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/App.ipa" -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}

      - name: 시크릿 정리
        if: always()
        run: |
          rm -f ios/App/App/GoogleService-Info.plist
          rm -rf ~/private_keys
